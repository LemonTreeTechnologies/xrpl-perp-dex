name: check

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: cargo check + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Must match rust-toolchain.toml so rustfmt/clippy components land
        # on the same toolchain cargo will auto-select when building.
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: orchestrator

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check --all-targets
        run: cargo check --all-targets --locked

      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      # RESP-wire-format-seam-class-ruling-2026-09-27 Q2. The builders' signature makes
      # an unframed producer unrepresentable for today's three; this asserts it for the
      # next one, which could assemble the prefix by hand and never touch the helper.
      # The cross-repo half SKIPS here (no enclave checkout) and runs before a migration.
      - name: prefix framing gate
        run: scripts/ci_prefix_framing.py

      # The same lesson one format over: the prefix-framing defect had three producers against
      # one parser and two never framed. This counts the producers of the QUORUM-BUNDLE format,
      # which had four until they were consolidated.
      # The path is relative to this job's working-directory (orchestrator), NOT the repo
      # root. It was written as `orchestrator/scripts/...` and so resolved to
      # orchestrator/orchestrator/... and exited 127 on every run — i.e. this gate has
      # never once executed. It merged during the Actions-quota outage, when nothing ran
      # to say so, which is the second time a quota-dead gate has let a defect through.
      - name: one quorum-bundle producer
        run: scripts/ci_one_quorum_bundle_producer.py

      # A logged error must print its CHAIN. `warn!("...: {}", e)` on an anyhow::Error shows
      # only the outermost context — which in the reserves publisher was a hand-written guess
      # at the cause — and discards the source, where the enclave's rc lives. The cluster
      # logged that guess hourly for over a week, 166 times, so the one fact needed to act was
      # never in the log at all. 101 sites had the defect against 2 that did not, which is why
      # this is a gate and not a convention.
      # Path is relative to this job's working-directory (orchestrator), NOT the repo root —
      # the mistake that left the gate above at exit 127 and never once executed.
      - name: logged errors print their chain
        run: scripts/ci_log_error_chain.py
