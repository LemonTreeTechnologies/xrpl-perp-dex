# cargo-audit config — #131 AC-CHUNK3-5 RUSTSEC gate.
#
# `cargo check`/`clippy` do NOT surface RustSec advisories (they are Cargo.lock
# scans). This config makes `cargo audit` a CI gate that FAILS on any NEW/unlisted
# vulnerability (regression protection) while documenting the current, pre-existing
# transitive-dep tail. Each ignore below is either unfixable on our rustc-1.88
# baseline or in an unused dependency; revisit on the noted trigger.
#
# Unmaintained/yanked-crate warnings (core2, derivative, paste, event-listener,
# lru, spin, …) are informational — the gate is not run with `--deny warnings`.

[advisories]
ignore = [
    # hickory-proto 0.25 (via libp2p DNS resolver) — NSEC3 closest-encloser
    # unbounded loop. No fixed upgrade available. Revisit on a libp2p bump.
    "RUSTSEC-2026-0118",
    # hickory-proto 0.25 — O(n^2) name compression on message encoding. Fix is
    # hickory 0.26.1, blocked by libp2p 0.56's pin. Revisit on a libp2p bump.
    "RUSTSEC-2026-0119",
    # rsa 0.9 Marvin timing side-channel — reached only via sqlx-mysql, which we do
    # NOT use (postgres only). Droppable by feature-gating sqlx off mysql (forward).
    "RUSTSEC-2023-0071",
    # ruint 1.17 — incorrect Uint shift overflow flags. Fix is ruint 1.20, whose
    # MSRV (rustc 1.90) exceeds our 1.88 CI baseline. Revisit on a toolchain bump.
    "RUSTSEC-2026-0220",
    # quinn-proto 0.11.15 — five QUIC-transport advisories (2026-10). NOT COMPILED
    # into the orchestrator: it is in Cargo.lock's full graph but reached only via
    # feature-gated-OFF paths — libp2p is declared default-features=false without
    # "quic" (transport is .with_tcp), and reqwest without "http3". Verified by
    # ARTIFACT, not grep: `cargo tree -i quinn-proto` with our enabled features
    # resolves to nothing while `-i libp2p-tcp` resolves (positive control), and no
    # *quinn* rlib is built in target/ while liblibp2p*.rlib are. So the advisories
    # are not in the binary. No patched version is reachable without bumping libp2p
    # itself (0.11.15 is the latest within its pin) — not worth a libp2p ripple for a
    # non-compiled crate. Revisit (and prefer a real bump) on the next libp2p bump.
    "RUSTSEC-2026-0338",
    "RUSTSEC-2026-0339",
    "RUSTSEC-2026-0340",
    "RUSTSEC-2026-0341",
    "RUSTSEC-2026-0342",
    # crypto-bigint 0.5.5 (via elliptic-curve 0.13 <- k256 0.13 + alloy-signer 1.x)
    # — timing variability in constant-time ops (2026-10-23). OWNER-APPROVED
    # 2026-11-03 on the auditor's ruling: custody/value keys live in the ENCLAVE,
    # not k256; the secret-bearing k256 uses are the operator CLI `sign-request`
    # (cli_tools.rs, local interactive one-shot signatures) and the #131 gas key
    # (commitment.rs, publishing halted since 2026-09-21); auth.rs only VERIFIES
    # public data. No path gives an attacker many timing samples. Fix = alloy 1->2
    # + k256 0.14 + elliptic-curve 0.14 (owed, own PR + re-audit of signing paths).
    # MANDATORY UN-IGNORE TRIGGERS — remove this ignore:
    #   1. BEFORE #131 gas-key publishing is reactivated;
    #   2. BEFORE mainnet;
    #   3. BEFORE/WHEN adding ANY automatic or remotely-triggerable k256 signing
    #      path (e.g. an auto-signer for operator requests, a sign-on-demand
    #      service) — that creates the mass-timing oracle this rationale says is absent.
    "RUSTSEC-2026-0387",
    # libsqlite3-sys 0.30.1 — bundled C SQLite CVE (2026-11). NOT COMPILED into the
    # orchestrator: sqlx is declared with features ["runtime-tokio", "postgres"] only;
    # sqlx-sqlite sits in Cargo.lock's full graph but no enabled feature reaches it.
    # Verified by ARTIFACT (same method as quinn-proto above), 2026-11-10:
    # `cargo tree -i libsqlite3-sys -e normal,build` resolves to nothing while
    # `-i sqlx-postgres` resolves (positive control), and target/debug/deps holds no
    # *sqlite* artifact while it holds libsqlx_postgres*. The fixed 0.39 is unreachable
    # under sqlx 0.8 (sqlx-sqlite =0.8.6 pins ^0.30.1). Revisit on the next sqlx bump,
    # and REMOVE this ignore if sqlite is ever enabled.
    "RUSTSEC-2026-0459",
]
