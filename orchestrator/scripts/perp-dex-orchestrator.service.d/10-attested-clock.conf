# Attested clock (trusted-price part (2), step 3) — the caller for
# ecall_perp_attested_clock_advance, which shipped 2026-09-23 with no caller.
#
# Env lives in systemd, not in start_orchestrator.sh: lifecycle and environment
# belong to the unit.
#
# WHY A PUBLIC XRPL ENDPOINT IS SOUND HERE, even unencrypted:
# the enclave verifies each validation's signature against its OWN pinned UNL and
# re-hashes the header, so a hostile endpoint (or a man in the middle on plain ws)
# can only WITHHOLD data or replay an older ledger. Withholding stalls the clock
# (fail-closed, and visible as attested_clock.advances not moving); a replay is
# refused by the enclave's monotonicity checks -89 (seq <= sealed seq) and -90
# (close_time went backwards). Forging needs validator private keys.
# TLS would add nothing the signature check does not already give, and the
# websocket client is deliberately built without a TLS stack.
#
# MEASURED before switching this on (2026-09-27), because "the stream exists" is not
# the same claim as "the quorum forms". Over a 75s window this endpoint relayed
# EXACTLY the 6 validators of the pinned testnet UNL and no others, with all 6
# signing 23 of the 24 ledgers seen (the 24th was cut off by the window edge). The
# >=80% floor is 5-of-6, so it is met with a validator to spare. A live header from
# the RPC below was 118 bytes and SHA512Half("LWR\0" + header) reproduced its
# reported ledger_hash, which is the check the enclave itself performs.
#
# Nodes 20.224.243.60 and 52.236.130.102 run the canonical unit; 20.71.184.176 has a
# hand-added EnvironmentFile that is NOT in this repo. Install this drop-in on all
# three so the clock is configured identically rather than by whatever each unit
# happens to load.
[Service]
Environment=PERP_ATTESTED_CLOCK=1
Environment=XRPL_WS_URL=ws://s.altnet.rippletest.net:51233
Environment=XRPL_RPC_URL=https://s.altnet.rippletest.net:51234
