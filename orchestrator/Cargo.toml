[package]
name = "perp-dex-orchestrator"
version = "0.1.0"
edition = "2021"
# Team toolchain baseline (matches .github/workflows/check.yml dtolnay/rust-toolchain@1.88.0).
# resolver = "3" makes cargo MSRV-aware so `alloy` is held at a 1.88-compatible
# release instead of auto-jumping to a version whose MSRV outruns CI (#131 chunk-2 regression).
rust-version = "1.88"
resolver = "3"
description = "Orchestrator for Perp DEX on XRPL with SGX enclave"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto (XRPL address derivation, DER encoding, SHA-512Half)
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["hazmat"] }
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
bs58 = { version = "0.5", features = ["check"] }
hex = "0.4"
rand = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Web server (user-facing API)
axum = { version = "0.8", features = ["json", "ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# P2P (order flow replication between operators)
libp2p = { version = "0.56", default-features = false, features = ["gossipsub", "tcp", "noise", "yamux", "tokio", "macros", "identify"] }

# Ethereum (Sepolia CommitmentRegistry submission)
# #131: alloy replaces the frozen ethers-rs stack (43-crate ethereum tail).
# tx-construction/query only; signing lives in the enclave.
alloy = { version = "1", features = ["providers", "contract", "sol-types", "network", "signer-local", "reqwest"] }

# XRPL binary codec + tx building
xrpl-mithril-codec = "0.3"
xrpl-mithril-models = "0.4"
xrpl-mithril-tx = "0.4"
xrpl-mithril-types = "0.1"

# PostgreSQL (trade history, funding payments)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }

# Session tokens
uuid = { version = "1", features = ["v4"] }

# Config files
toml = "0.8"

# Error handling
anyhow = "1"

# REQ-8 commit 13: trait-abstracted async API for Path A ceremony driver
async-trait = "0.1"

[dev-dependencies]
# Test fixtures (O-L3: escrow-seed file resolver)
tempfile = "3"
